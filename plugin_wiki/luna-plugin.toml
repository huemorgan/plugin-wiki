# Data manifest — read by the marketplace + installer without importing Python.
# Keep in sync with PluginManifest in __init__.py.

name = "plugin-wiki"
shown_name = "Wiki"
version = "0.3.1"
description = "Mission knowledge base: wiki pages, revisions, citations, open questions."
entry = "plugin_wiki"
sdk_version = "0"
license = "MIT"
category = "global"
tags = ["knowledge", "wiki", "memory"]
provider = "wiki"
db_tables = ["wiki_pages", "wiki_revisions", "wiki_citations", "wiki_open_questions", "wiki_links"]
readme = """
# plugin-wiki

Luna's mission knowledge base — a Karpathy-style LLM wiki. Authored, revisable
markdown pages with [[wikilinks]], citations, and open questions. Knowledge
accumulates by compile-time synthesis (authored pages), not query-time RAG.

Substrate only: other plugins (e.g. plugin-curiosity) drive who writes and when,
via the `wiki` provider.
"""

[requires]
tools = 9
tables = 5

[[tools]]
name = "wiki_toc"
description = "Table of contents: every page's slug, title, summary."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "wiki_read"
description = "Read a page's full markdown body."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "wiki_search"
description = "Relevance-ranked page summaries for a query."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "wiki_write"
description = "Create or replace a wiki page (records a revision)."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "wiki_patch"
description = "Edit part of a page via find/replace (records a revision)."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "wiki_cite"
description = "Attach a source URL to a page."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "wiki_ask"
description = "Record an open question for later research."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "wiki_resolve_question"
description = "Mark an open question resolved."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "wiki_list_questions"
description = "List open or resolved wiki questions."
policy = "auto_approve"
risk_level = "low"
