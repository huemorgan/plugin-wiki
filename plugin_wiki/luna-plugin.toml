# Data manifest — read by the marketplace + installer without importing Python.
# Keep in sync with PluginManifest in __init__.py.

name = "plugin-wiki"
shown_name = "Wiki"
version = "0.9.0"
description = "Mission knowledge base: isolated wikis of pages, revisions, citations, open questions."
entry = "plugin_wiki"
sdk_version = "0"
license = "MIT"
category = "global"
tags = ["knowledge", "wiki", "memory"]
provider = "wiki"
db_tables = ["wikis", "wiki_pages", "wiki_revisions", "wiki_citations", "wiki_open_questions", "wiki_links"]
readme = """
# plugin-wiki

Luna's mission knowledge base — a Karpathy-style LLM wiki. Authored, revisable
markdown pages with [[wikilinks]], citations, and open questions, organized
into isolated wikis (one per mission, client, or domain). Each wiki carries a
name and a description that the nightly dream keeps current.

Substrate only: other plugins (e.g. plugin-curiosity) drive who writes and when,
via the `wiki` provider.
"""

[requires]
tools = 15
tables = 6

[[tools]]
name = "wiki_list_wikis"
description = "List all wikis: slug, name, description, page count."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "wiki_create_wiki"
description = "Create a new isolated wiki (mission, client, domain)."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "wiki_update_wiki"
description = "Rename a wiki or refresh its description."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "wiki_toc"
description = "Table of contents of one wiki: every page's slug, title, summary."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "wiki_read"
description = "Read a page's full markdown body."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "wiki_search"
description = "Relevance-ranked page summaries for a query, within one wiki."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "wiki_write"
description = "Create or replace a wiki page (records a revision)."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "wiki_patch"
description = "Edit part of a page via find/replace (records a revision)."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "wiki_archive_page"
description = "Archive a page: hidden from TOC/search/context, reversible."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "wiki_unarchive_page"
description = "Restore an archived page to the live wiki."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "wiki_delete_page"
description = "Permanently delete a page and its history (for junk/duplicates)."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "wiki_cite"
description = "Attach a source URL to a page."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "wiki_ask"
description = "Record an open question for later research."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "wiki_resolve_question"
description = "Mark an open question resolved."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "wiki_list_questions"
description = "List open or resolved wiki questions."
policy = "auto_approve"
risk_level = "low"
